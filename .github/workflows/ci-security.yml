name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  # Job 1: Build and verify dependencies install correctly
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

  # Job 2: Test and Scan (Runs after building)
  test:
    runs-on: ubuntu-latest
    needs: build # Ensures tests only run if the build job passes successfully
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Testing & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest bandit

      - name: Run unit tests
        run: pytest

      - name: Run Security Scan (Bandit)
        run: bandit -r . -x test_calculator.py
